name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --no-audit --no-fund

      - name: Type-check, unit-test and build the UI
        working-directory: ui
        run: |
          npx tsc -b
          npx vitest run
          npx vite build

      - name: Build and test the native app
        run: |
          dotnet build Vystral.slnx -c Release -p:Platform=x64
          dotnet test tests/Vystral.Tests -c Release

  # The end-to-end suite (~400 tests against the preview backend) is split across eight runners, one browser
  # each: a 4-core runner without a GPU renders Immersive's effects in software, and two browsers at once
  # overloaded it into timeouts.
  e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --no-audit --no-fund

      - name: End-to-end, accessibility and visual tests (preview data), shard ${{ matrix.shard }} of 8
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --shard=${{ matrix.shard }}/8

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: ui/playwright-report
